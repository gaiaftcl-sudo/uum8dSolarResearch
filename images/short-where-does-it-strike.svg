<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="ui-monospace,'SF Mono',Menlo,monospace">
 <defs>
  <style>
   .serif{font-family:Georgia,'Times New Roman',serif}
   .k{font-size:13px;letter-spacing:3px;fill:#5f7285}.cap{font-size:12px;fill:#5f7285}
   .scan{animation:scan 5s linear infinite}
   @keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
   .arriveB{animation:arriveB 5s linear infinite}@keyframes arriveB{0%,50%{opacity:.15}56%,100%{opacity:1}}
   .arriveC{animation:arriveC 5s linear infinite}@keyframes arriveC{0%,74%{opacity:.15}80%,100%{opacity:1}}
   .flk{animation:flk 1.1s steps(1) infinite}@keyframes flk{0%,50%{opacity:1}50.01%,100%{opacity:.12}}
   @media(prefers-reduced-motion:reduce){.scan,.arriveB,.arriveC,.flk{animation:none;opacity:1}}
  </style>
 </defs>
 <rect width="800" height="700" fill="#0a0e14"/>
 <text x="60" y="66" class="k">GENOME EDITING · THE OFF-TARGET SEARCH</text>
 <text x="58" y="120" class="serif" font-size="32" fill="#e8eef6">Where else does the guide strike?</text>
 <text x="58" y="158" class="serif" font-size="22" fill="#8195aa">Exact catches a real hit. The guessing score can miss it.</text>

 <!-- genome track -->
 <rect x="60" y="228" width="680" height="30" rx="6" fill="#0f1620" stroke="#1e2936"/>
 <g fill="#1c2532">
  <rect x="80" y="236" width="6" height="14"/><rect x="120" y="236" width="6" height="14"/><rect x="180" y="236" width="6" height="14"/>
  <rect x="260" y="236" width="6" height="14"/><rect x="360" y="236" width="6" height="14"/><rect x="500" y="236" width="6" height="14"/>
  <rect x="560" y="236" width="6" height="14"/><rect x="660" y="236" width="6" height="14"/><rect x="700" y="236" width="6" height="14"/>
 </g>
 <text x="60" y="216" class="cap">the genome — the guide scans every window</text>

 <!-- candidate site markers -->
 <g stroke-width="2">
  <line x1="200" y1="224" x2="200" y2="262" stroke="#3fb950"/>
  <line x1="430" y1="224" x2="430" y2="262" stroke="#f85149"/>
  <line x1="620" y1="224" x2="620" y2="262" stroke="#d0a54f"/>
 </g>

 <!-- the sweeping guide -->
 <g class="scan"><rect x="60" y="222" width="8" height="42" rx="2" fill="#eef4ff" opacity=".75"/>
  <rect x="44" y="196" width="40" height="18" rx="3" fill="#5aa9e6"/><text x="64" y="209" font-size="10" fill="#0a0e14" text-anchor="middle">GUIDE</text></g>

 <!-- SITE 1: on-target -->
 <g>
  <text x="200" y="330" class="cap" text-anchor="middle" fill="#7bcf8a">on-target</text>
  <circle cx="200" cy="378" r="26" fill="#0d1f16" stroke="#3fb950" stroke-width="2"/>
  <path d="M188,378 l7,8 l14,-17" fill="none" stroke="#3fb950" stroke-width="3"/>
  <text x="200" y="430" class="cap" text-anchor="middle">EXACT ✓ · FLOAT ✓</text>
 </g>
 <!-- SITE 2: off-target next to PAM — exact CATCHES, float MISSES -->
 <g class="arriveB">
  <text x="430" y="330" class="cap" text-anchor="middle" fill="#f0a6a2">off-target · 3 mm by PAM</text>
  <circle cx="404" cy="378" r="26" fill="#1c1113" stroke="#f85149" stroke-width="2"/>
  <path d="M394,376 v-6 a10,10 0 0 1 20,0 v6 M396,376 h16 v14 h-16 z" fill="none" stroke="#f85149" stroke-width="2.4"/>
  <text x="404" y="418" class="cap" text-anchor="middle" fill="#f85149">EXACT · caught</text>
  <circle cx="470" cy="378" r="20" fill="#0f1620" stroke="#2b3440" stroke-dasharray="3 3"/>
  <text x="470" y="382" class="cap" text-anchor="middle" fill="#5f7285">float</text>
  <text x="470" y="418" class="cap" text-anchor="middle" fill="#7a8896">missed</text>
 </g>
 <!-- SITE 3: borderline — float flickers -->
 <g class="arriveC">
  <text x="620" y="330" class="cap" text-anchor="middle" fill="#d0a54f">borderline · 3 mm</text>
  <circle cx="594" cy="378" r="26" fill="#1c1113" stroke="#f85149" stroke-width="2"/>
  <path d="M584,376 v-6 a10,10 0 0 1 20,0 v6 M586,376 h16 v14 h-16 z" fill="none" stroke="#f85149" stroke-width="2.4"/>
  <text x="594" y="418" class="cap" text-anchor="middle" fill="#f85149">EXACT · steady</text>
  <circle class="flk" cx="660" cy="378" r="20" fill="#2a1414" stroke="#f85149"/>
  <text x="660" y="382" class="cap" text-anchor="middle" fill="#f8b0ac">float</text>
  <text x="660" y="418" class="cap" text-anchor="middle" fill="#d0a54f">flickers</text>
 </g>

 <line x1="60" y1="470" x2="740" y2="470" stroke="#1e2936"/>
 <text x="60" y="512" class="serif" font-size="24" fill="#e8eef6">The exact off-target set is one answer, on every machine.</text>
 <text x="60" y="548" class="serif" font-size="24" fill="#e8eef6">The guessing score <tspan fill="#f85149">misses a real hit</tspan> — and <tspan fill="#d0a54f">flickers on the next.</tspan></text>
 <text x="60" y="600" class="cap">A genome edit you can't undo deserves a safety verdict a stranger can re-derive — not a number that moves.</text>
 <text x="60" y="672" class="cap" fill="#47576a">Synthetic, representative · measured: reproduce/crispr-guide-offtarget-exact-vs-float.swift · the real-guide court is a charter.</text>
</svg>
