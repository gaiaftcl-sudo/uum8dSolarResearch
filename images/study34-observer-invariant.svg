 <text x="42" y="46" class="kick">AFFINE.EARTH · STUDY 34 · FUSION CONTROL ON THE vQBIT SUBSTRATE</text>
 <text x="40" y="92" class="h serif">We need fusion — and a verdict the world can check.</text>
 <text x="42" y="122" class="sub">The physics is known. What was missing is a safety verdict that is exact, the same for every observer, and</text>
 <text x="42" y="140" class="sub">re-derivable by anyone on Earth — not a bigger computer guessing. <tspan fill="#58a6ff">The numbers are in.</tspan></text>
