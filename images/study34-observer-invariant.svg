 <text x="210" y="486" text-anchor="middle" class="tiny">ITER — at the exact edge of its 0.85 Greenwald safety threshold</text>
 <rect x="440" y="196" width="418" height="118" rx="7" fill="#111823" stroke="#3a5169"/>
 <text x="462" y="224" class="lbl" fill="#8aa0b6">THE AFFINE WAY · vQbit · exact integer</text>
 <text class="hold" x="462" y="264" font-size="26" font-weight="bold" fill="#e3b341">NOT_MEASURED</text>
 <text x="462" y="288" class="tiny" fill="#8195aa">at the 0.85 edge — closer than π is pinned</text>
 <text x="462" y="305" class="tiny" fill="#3fb950">one exact integer everywhere else · the same on every machine</text>
 <rect class="swbox" x="440" y="330" width="418" height="118" rx="7" fill="#0d141d" stroke="#7a2420"/>
 <text x="462" y="358" class="lbl">a trained surrogate · float</text>
 <text class="sw win" x="462" y="398" font-size="28" font-weight="bold">WIN</text>
 <text class="sm miss" x="462" y="398" font-size="28" font-weight="bold">MISS</text>
 <text x="556" y="398" class="sub">same plasma · same instant</text>
 <text x="462" y="424" class="tiny" fill="#8a6a6a">the π it rounds to decides it: 355/113 vs 333/106</text>
 <line x1="42" y1="512" x2="858" y2="512" stroke="#1e2936"/>
 <text x="42" y="536" class="tiny" fill="#8195aa">THE NUMBERS ARE IN — 142 operating points (ITER · SPARC · JET · DIII-D) where the float verdict contradicts itself.</text>
 <text x="42" y="554" class="tiny" fill="#8195aa">The exact vQbit court refused every one; single precision flipped none — this is about agreement, not accuracy.</text>
 <text x="42" y="584" class="serif" font-size="17" fill="#e8eef6">Affine Fusion on the vQbit substrate — exact, invariant, re-derivable. <tspan class="acc">The road every observer can re-derive.</tspan></text>
